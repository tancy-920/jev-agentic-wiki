[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-agentic-rag"
version = "0.1.0"
description = "Complete-article Wiki assistant with reproducible Wiki and graph-navigation experiments"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1",
  "pypdf>=5,<7", "fonttools>=4.55,<5", "tiktoken>=0.9,<1", "rank-bm25>=0.2.2,<0.3",
  "qdrant-client>=1.14,<2", "numpy>=1.26,<3",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.4,<6", "torch==2.13.0"]
agent = ["langgraph>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2"]
evaluation = ["ragas>=0.3,<1", "matplotlib>=3.9,<4", "pandas>=2.2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
jev-rag = "jev_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
